name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (lightweight - no torch; the transformer smoke test is skipped here)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
