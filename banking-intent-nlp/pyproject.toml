[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-intent-nlp"
version = "0.1.0"
description = "Banking intent classification: TF-IDF baseline vs fine-tuned DistilBERT, served with FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Himani Gupta" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Needed only for the transformer (training and serving a fine-tuned model)
nlp = ["torch>=2.3", "transformers>=4.40"]
dev = ["pytest>=7.4", "httpx>=0.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
